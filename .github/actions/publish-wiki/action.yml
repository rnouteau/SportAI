name: Publish wiki Home
description: Append NRT F1 history and push Home.md to the GitHub Wiki

inputs:
  report_json:
    description: Path to the ball NRT report.json
    required: true
  report_json_player:
    description: Optional path to the player NRT report.json
    required: false
    default: ""
  report_json_court:
    description: Optional path to the court NRT report.json
    required: false
    default: ""
  token:
    description: PAT with permission to push to the repository wiki
    required: true
  commit:
    description: Git commit SHA of the run
    required: true
  run_url:
    description: URL of the GitHub Actions run
    required: true
  workflow:
    description: Workflow display name
    required: true
  conclusion:
    description: Job conclusion (success, failure, ...)
    required: true
  tolerance:
    description: Baseline metric tolerance used for Status column
    required: false
    default: "0.005"

runs:
  using: composite
  steps:
    - name: Check report and token
      id: check
      shell: bash
      env:
        WIKI_TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$WIKI_TOKEN" ]; then
          echo "::warning::WIKI_TOKEN is empty — wiki Home not updated"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "${{ inputs.report_json }}" ]; then
          echo "::warning::Report not found at ${{ inputs.report_json }} — wiki Home not updated"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "${{ inputs.report_json_player }}" ] && [ -f "${{ inputs.report_json_player }}" ]; then
          echo "player_report=${{ inputs.report_json_player }}" >> "$GITHUB_OUTPUT"
        else
          echo "player_report=" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.report_json_player }}" ]; then
            echo "::warning::Player report not found at ${{ inputs.report_json_player }} — wiki Home without player section"
          fi
        fi
        if [ -n "${{ inputs.report_json_court }}" ] && [ -f "${{ inputs.report_json_court }}" ]; then
          echo "court_report=${{ inputs.report_json_court }}" >> "$GITHUB_OUTPUT"
        else
          echo "court_report=" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.report_json_court }}" ]; then
            echo "::warning::Court report not found at ${{ inputs.report_json_court }} — wiki Home without court section"
          fi
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Checkout wiki
      if: steps.check.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        token: ${{ inputs.token }}
        path: wiki-repo

    - name: Render Home.md and update history
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        EXTRA_ARGS=()
        if [ -n "${{ steps.check.outputs.player_report }}" ]; then
          EXTRA_ARGS+=(--report-player "${{ steps.check.outputs.player_report }}")
        fi
        if [ -n "${{ steps.check.outputs.court_report }}" ]; then
          EXTRA_ARGS+=(--report-court "${{ steps.check.outputs.court_report }}")
        fi
        python "$GITHUB_WORKSPACE/scripts/render_wiki_home.py" \
          --report "${{ inputs.report_json }}" \
          "${EXTRA_ARGS[@]}" \
          --output wiki-repo/Home.md \
          --history-in wiki-repo/nrt-history.json \
          --history-out wiki-repo/nrt-history.json \
          --commit "${{ inputs.commit }}" \
          --run-url "${{ inputs.run_url }}" \
          --workflow "${{ inputs.workflow }}" \
          --conclusion "${{ inputs.conclusion }}" \
          --tolerance "${{ inputs.tolerance }}"

    - name: Commit and push wiki
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd wiki-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Home.md nrt-history.json
        if git diff --staged --quiet; then
          echo "Wiki unchanged — nothing to push"
          exit 0
        fi
        git commit -m "Update Home + F1 history from NRT (${{ inputs.commit }})"
        git push
