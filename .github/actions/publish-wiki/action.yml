name: Publish wiki
description: Render the wiki (Home, one page per NRT suite, sidebar, history) and push it

inputs:
  reports_dir:
    description: Folder holding <suite>/report.json for each NRT suite
    required: false
    default: outputs/tests
  token:
    description: PAT with permission to push to the repository wiki
    required: true
  commit:
    description: Git commit SHA of the run
    required: true
  run_url:
    description: URL of the GitHub Actions run
    required: true
  workflow:
    description: Workflow display name
    required: true
  conclusion:
    description: Job conclusion (success, failure, ...)
    required: true
  tolerance:
    description: Baseline tolerance used for the status column
    required: false
    default: "0.005"

runs:
  using: composite
  steps:
    - name: Check reports and token
      id: check
      shell: bash
      env:
        WIKI_TOKEN: ${{ inputs.token }}
        REPORTS_DIR: ${{ inputs.reports_dir }}
      run: |
        if [ -z "$WIKI_TOKEN" ]; then
          echo "::warning::WIKI_TOKEN is empty — wiki not updated"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! ls "$REPORTS_DIR"/*/report.json >/dev/null 2>&1; then
          echo "::warning::No report.json under $REPORTS_DIR — wiki not updated"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Reports found:"; ls "$REPORTS_DIR"/*/report.json
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Checkout wiki
      if: steps.check.outputs.skip != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        token: ${{ inputs.token }}
        path: wiki-repo

    - name: Render wiki pages
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python "$GITHUB_WORKSPACE/scripts/render_wiki_home.py" \
          --reports-dir "${{ inputs.reports_dir }}" \
          --wiki-dir wiki-repo \
          --commit "${{ inputs.commit }}" \
          --run-url "${{ inputs.run_url }}" \
          --repo-url "${{ github.server_url }}/${{ github.repository }}" \
          --workflow "${{ inputs.workflow }}" \
          --conclusion "${{ inputs.conclusion }}" \
          --tolerance "${{ inputs.tolerance }}"

    - name: Commit and push wiki
      if: steps.check.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd wiki-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --staged --quiet; then
          echo "Wiki unchanged — nothing to push"
          exit 0
        fi
        git commit -m "Update wiki from NRT (${{ inputs.commit }})"
        git push
