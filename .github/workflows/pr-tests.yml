name: Tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "configs/**"
      - "utils/**"
      - "requirements*.txt"
      - "pytest.ini"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pr-tests.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Regenerate the baseline (download it from the artifacts, then commit it)"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -m unit -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests
        run: python -m pytest tests/integration -m integration -q

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Unit + integration with coverage
        run: >
          python -m pytest tests/unit tests/integration
          -m "unit or integration"
          --cov=pipeline --cov=tests.evaluation --cov=tests.baseline
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Ruff check
        run: ruff check pipeline tests scripts utils

      - name: Ruff format
        run: ruff format --check pipeline tests scripts utils

      - name: Mypy
        run: mypy --config-file=pyproject.toml pipeline

  changes:
    runs-on: ubuntu-latest
    outputs:
      nrt: ${{ steps.filter.outputs.nrt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nrt:
              - 'pipeline/models/**'
              - 'pipeline/run.py'
              - 'pipeline/video_reader.py'
              - 'tests/nrt/**'
              - 'tests/configs/nrt/**'
              - 'tests/baselines/**'
              - 'tests/evaluation/**'
              - 'requirements*.txt'
              - '.github/workflows/pr-tests.yml'

  nrt:
    needs: [unit, integration, coverage, lint, changes]
    if: >
      always() &&
      needs.unit.result == 'success' &&
      needs.integration.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.lint.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.nrt == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/configs/nrt/tennis/config_test_tennis_accuracy_ball_detection.yaml', 'tests/configs/nrt/tennis/config_test_tennis_accuracy_players_detection.yaml','tests/configs/nrt/tennis/config_test_tennis_accuracy_court_detection.yaml') }}

      - name: Run tennis NRT (ball + players + court)
        if: env.HF_TOKEN != ''
        run: python -m pytest tests/nrt/tennis -m nrt -s -rs ${{ inputs.update_baseline && '--update-baseline' || '' }}

      - name: Skip notice (no HF token)
        if: env.HF_TOKEN == ''
        run: echo "::warning::HF_TOKEN missing (PR from a fork?) - NRT test not run"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Tennis ball detection"
            cat outputs/tests/tennis_ball_detection/report.md 2>/dev/null || echo "_No ball report._"
            echo
            echo "## Tennis player detection"
            cat outputs/tests/tennis_player_detection/report.md 2>/dev/null || echo "_No player report._"
            echo
            echo "## Tennis court detection"
            cat outputs/tests/tennis_court_detection/report.md 2>/dev/null || echo "_No court report._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-nrt-reports
          path: |
            outputs/tests/tennis_ball_detection
            outputs/tests/tennis_player_detection
            outputs/tests/tennis_court_detection
            tests/baselines/tennis/tennis_ball_detection.json
            tests/baselines/tennis/tennis_player_detection.json
            tests/baselines/tennis/tennis_court_detection.json
          if-no-files-found: ignore

      - name: Publish wiki Home
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-wiki
        with:
          report_json: outputs/tests/tennis_ball_detection/report.json
          report_json_player: outputs/tests/tennis_player_detection/report.json
          report_json_court: outputs/tests/tennis_court_detection/report.json
          token: ${{ secrets.WIKI_TOKEN }}
          commit: ${{ github.sha }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          workflow: ${{ github.workflow }}
          conclusion: ${{ job.status }}
          tolerance: "0.005"
