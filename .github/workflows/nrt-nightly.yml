name: NRT Nightly

on:
  schedule:
    # 02:00 UTC every day (~03:00 CET / ~04:00 CEST)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nrt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/configs/nrt/tennis/config_test_tennis_accuracy_ball_detection.yaml', 'tests/configs/nrt/tennis/config_test_tennis_accuracy_players_detection.yaml') }}

      - name: Run tennis NRT (ball + players)
        if: env.HF_TOKEN != ''
        run: python -m pytest tests/nrt/tennis -m nrt -s -rs

      - name: Fail if HF_TOKEN missing
        if: env.HF_TOKEN == ''
        run: |
          echo "::error::HF_TOKEN secret is required for the nightly NRT"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Tennis ball detection"
            cat outputs/tests/tennis_ball_detection/report.md 2>/dev/null || echo "_No ball report._"
            echo
            echo "## Tennis player detection"
            cat outputs/tests/tennis_player_detection/report.md 2>/dev/null || echo "_No player report._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-nrt-reports-nightly
          path: |
            outputs/tests/tennis_ball_detection
            outputs/tests/tennis_player_detection
            tests/baselines/tennis/tennis_ball_detection.json
            tests/baselines/tennis/tennis_player_detection.json
          if-no-files-found: ignore

      - name: Publish wiki Home
        if: always()
        uses: ./.github/actions/publish-wiki
        with:
          report_json: outputs/tests/tennis_ball_detection/report.json
          report_json_player: outputs/tests/tennis_player_detection/report.json
          token: ${{ secrets.WIKI_TOKEN }}
          commit: ${{ github.sha }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          workflow: ${{ github.workflow }}
          conclusion: ${{ job.status }}
          tolerance: "0.005"
