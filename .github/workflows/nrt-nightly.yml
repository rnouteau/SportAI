name: NRT Nightly

on:
  schedule:
    # 02:00 UTC every day (~03:00 CET / ~04:00 CEST)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nrt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/configs/nrt/tennis/*.yaml') }}

      - name: Run tennis NRT (every suite of tests/nrt/suites.py)
        if: env.HF_TOKEN != ''
        run: python -m pytest tests/nrt/tennis -m nrt -s -rs

      - name: Fail if HF_TOKEN missing
        if: env.HF_TOKEN == ''
        run: |
          echo "::error::HF_TOKEN secret is required for the nightly NRT"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(outputs/tests/*/report.md)
          {
            if [ ${#reports[@]} -eq 0 ]; then echo "_No NRT report._"; fi
            for report in "${reports[@]}"; do cat "$report"; echo; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-nrt-reports-nightly
          path: |
            outputs/tests
            tests/baselines/tennis
          if-no-files-found: ignore

      - name: Publish wiki
        if: always()
        uses: ./.github/actions/publish-wiki
        with:
          reports_dir: outputs/tests
          token: ${{ secrets.WIKI_TOKEN }}
          commit: ${{ github.sha }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          workflow: ${{ github.workflow }}
          conclusion: ${{ job.status }}
          tolerance: "0.005"
