name: NRT tennis ball

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "configs/**"
      - "utils/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/nrt-tennis-ball.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Régénérer la baseline (à télécharger dans les artefacts puis commiter)"
        type: boolean
        default: false

jobs:
  nrt-tennis-ball:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/configs/nrt/tennis/config_test_tennis_accuracy_ball_tracking.yaml') }}

      - name: Run ball tracking NRT
        if: env.HF_TOKEN != ''
        run: python -m pytest tests/nrt/tennis -m nrt -s -rs ${{ inputs.update_baseline && '--update-baseline' || '' }}

      - name: Skip notice (no HF token)
        if: env.HF_TOKEN == ''
        run: echo "::warning::HF_TOKEN absent (PR depuis un fork ?) - test NRT non exécuté"

      - name: Publish summary
        if: always()
        run: cat outputs/tests/tennis_ball_tracking/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-ball-tracking-report
          path: |
            outputs/tests/tennis_ball_tracking
            tests/baselines/tennis_ball_tracking.json
          if-no-files-found: ignore
