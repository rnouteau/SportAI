name: Tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "configs/**"
      - "utils/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Regenerate the baseline (download it from the artifacts, then commit it)"
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -m unit -q

  changes:
    runs-on: ubuntu-latest
    outputs:
      nrt: ${{ steps.filter.outputs.nrt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nrt:
              - 'pipeline/models/**'
              - 'pipeline/run.py'
              - 'pipeline/video_reader.py'
              - 'tests/nrt/**'
              - 'tests/configs/nrt/**'
              - 'tests/baselines/**'
              - 'tests/evaluation/**'
              - 'requirements*.txt'
              - '.github/workflows/tests.yml'

  nrt:
    needs: [unit, changes]
    if: >
      always() &&
      needs.unit.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.nrt == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SPORTAI_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: |
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('tests/configs/nrt/tennis/config_test_tennis_accuracy_ball_tracking.yaml') }}

      - name: Run ball tracking NRT
        if: env.HF_TOKEN != ''
        run: python -m pytest tests/nrt/tennis -m nrt -s -rs ${{ inputs.update_baseline && '--update-baseline' || '' }}

      - name: Skip notice (no HF token)
        if: env.HF_TOKEN == ''
        run: echo "::warning::HF_TOKEN missing (PR from a fork?) - NRT test not run"

      - name: Publish summary
        if: always()
        run: cat outputs/tests/tennis_ball_tracking/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-ball-tracking-report
          path: |
            outputs/tests/tennis_ball_tracking
            tests/baselines/tennis/tennis_ball_tracking.json
          if-no-files-found: ignore
