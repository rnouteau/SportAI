analysis: pipeline.objects.tennis.TennisAnalysis
models:
  - name: pipeline.models.tennis.TennisBallModel
    config:
      device: "cuda"
      threshold: 0.5
      weight: "./models/TENNIS_BALL_MODEL_04_11_2026.pt"
  - name: pipeline.models.tennis.TennisPlayerModel
    config:
        device: "cuda"
        weight: "./models/yolo11s.pt"
        conf: 0.1
        tracker: "bytetrack.yaml"
  - name: pipeline.models.tennis.TennisCourtModel
    config:
        device: "cuda"
        weight: "./models/TENNIS_COURT_MODEL_18_11_2026.pt"
        # Dataset exported as stretched 640x640: reproduce it at inference.
        input_size: 640
        stretch_input: true
        min_conf: 0.3
        ransac_px: 5.0              # pixels
        smoothing_window: 5         # frames (1 = no smoothing)
        smoothing_reset_ratio: 0.02 # scene-cut reset, fraction of frame diagonal
stats:
  - name: pipeline.stats.tennis.TennisLegsCourtStat
  - name: pipeline.stats.tennis.TennisPlayerSideStat
  - name: pipeline.stats.tennis.TennisPlayerSelectorStat
  - name: pipeline.stats.tennis.TennisPlayerMovementStat
outputs:
  dir: ./outputs/tennis   # each run writes into <dir>/<analysis id>/ (id = cleaned video name)
  video: true             # overlay.mp4 (H.264)
  heatmaps: true          # heatmaps/heatmap_player_<id>.png
